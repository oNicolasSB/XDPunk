[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "xdpunk-cli"
version = "0.2.0"
description = "CLI de plano de controle do XDPunk: rotas, firewall stateless e load balancer de links WAN"
requires-python = ">=3.8"

[project.scripts]
xdpunk-cli = "xdpunk_cli.cli:main"

[tool.setuptools]
packages = ["xdpunk_cli"]
